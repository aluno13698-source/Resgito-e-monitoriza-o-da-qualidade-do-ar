services:
  - type: web
    name: estacao-meteo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true          # deploy automático a cada push para o GitHub
    healthCheckPath: /api/saude
    envVars:
      - key: API_KEY          # gerada automaticamente; copiar para o Arduino (arduino_secrets.h)
        generateValue: true
      - key: ADMIN_PASSWORD   # definir no painel do Render (não fica no GitHub)
        sync: false
